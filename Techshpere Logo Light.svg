<svg width="160" height="48" viewBox="0 0 160 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lightOrbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#073ee4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Techshpere Symbol - Sphere with orbit rings -->
  <g id="techshpere-symbol">
    <!-- Outer orbit ring -->
    <circle cx="24" cy="24" r="18" fill="none" stroke="#073ee4" stroke-width="2.5" stroke-dasharray="56.55" stroke-dashoffset="0" />
    <!-- Inner orbit ring (tilted) -->
    <ellipse cx="24" cy="24" rx="14" ry="7" fill="none" stroke="#3b82f6" stroke-width="2" />
    <!-- Core sphere -->
    <circle cx="24" cy="24" r="7" fill="#073ee4" />
    <!-- Core highlight -->
    <circle cx="22" cy="22" r="2" fill="#ffffff" opacity="0.6" />
    <!-- Connection dots -->
    <circle cx="12" cy="24" r="2" fill="#073ee4" />
    <circle cx="36" cy="24" r="2" fill="#073ee4" />
    <circle cx="24" cy="12" r="2" fill="#3b82f6" />
    <circle cx="24" cy="36" r="2" fill="#3b82f6" />
  </g>
  
  <!-- Techshpere Wordmark -->
  <text x="56" y="30" font-family="'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="800" fill="#111827" letter-spacing="-0.02em">Techshpere</text>
  
  <!-- Tagline -->
  <text x="56" y="44" font-family="'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="8.5" font-weight="500" fill="#64748b" letter-spacing="0.03em">TECHNICAL EDUCATION &amp; TRAINING</text>
</svg>
